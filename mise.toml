# Toolchain used by CI and release validation. Upgrade deliberately together
# with build/API compatibility fixes rather than following a moving snapshot.
[tools]
zig = "0.17.0"

[tasks.ci]
description = "Run the Linux GitHub Actions jobs locally with act"
tools = { act = "0.2.89" }
run = "act push --workflows .github/workflows/ci.yml"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"
